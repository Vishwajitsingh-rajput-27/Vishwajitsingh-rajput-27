name: Refresh Profile Metrics

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "config/theme.json"
      - "scripts/generate-metrics.js"
      - ".github/workflows/metrics.yml"

permissions:
  contents: read

concurrency:
  group: profile-metrics-${{ github.repository }}
  cancel-in-progress: false

jobs:
  metrics:
    permissions:
      contents: write
    name: Generate repository-owned metrics asset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate and validate metrics SVG
        run: |
          npm run metrics
          npm run validate-svg

      - name: Commit only changed metrics
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/generated/metrics.svg; then
            echo "Metrics are unchanged; no commit is required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/metrics.svg
          git commit -m "chore(profile): refresh generated metrics"
          git pull --rebase origin main
          git push origin HEAD:main
