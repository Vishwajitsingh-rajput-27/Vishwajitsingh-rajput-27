name: Validate GitHub Profile

on:
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "config/**"
      - "data/**"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/**"
      - "config/**"
      - "data/**"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate generated profile repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate configuration, links, workflows, and SVG assets
        run: |
          npm run validate
          npm run check-links
          npm run validate-workflows
          npm run validate-svg
          npm run scan-secrets
          npm run test-protected-content
          npm run test-change-detection
          npm run test-resilience

      - name: Verify deterministic generated output
        run: |
          npm run build
          npm run validate
          npm run validate-svg
          git diff --exit-code -- README.md assets/generated/metrics.svg
