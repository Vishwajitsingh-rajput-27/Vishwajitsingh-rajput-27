<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vishwajitsingh Rajput profile banner</title>
  <desc id="desc">Professional banner featuring name, headline, and tagline with subtle technical background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="55%" stop-color="#0B1324" />
      <stop offset="100%" stop-color="#111B34" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1F2A44" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <g opacity="0.45">
    <circle cx="1030" cy="70" r="2" fill="#22D3EE"/>
    <circle cx="1110" cy="120" r="2" fill="#3B82F6"/>
    <circle cx="980" cy="150" r="2" fill="#8B5CF6"/>
    <circle cx="1060" cy="190" r="2" fill="#22D3EE"/>
    <circle cx="930" cy="220" r="2" fill="#3B82F6"/>
  </g>
  <rect x="54" y="48" width="1092" height="264" rx="22" fill="#0A1223" opacity="0.78"/>
  <rect x="54" y="48" width="1092" height="264" rx="22" fill="none" stroke="url(#accent)" opacity="0.45"/>
  <text x="90" y="142" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">Vishwajitsingh Rajput</text>
  <text x="90" y="192" fill="#9BC6FF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Computer Engineering Student | Full-Stack Developer | AI &amp; Geospatial Builder</text>
  <text x="90" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="24">Building intelligent systems, practical developer tools, and ambitious AI-powered products.</text>
</svg>
