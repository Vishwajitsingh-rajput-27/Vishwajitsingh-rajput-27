<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Professional profile footer</title>
  <desc id="desc">A clean footer inviting thoughtful collaboration and open-source work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070B14"/><stop offset="0.5" stop-color="#0F172A"/><stop offset="1" stop-color="#070B14"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  </defs>
  <rect width="1200" height="150" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="148" rx="23" fill="none" stroke="url(#line)" stroke-opacity="0.4"/>
  <text x="600" y="64" text-anchor="middle" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Build thoughtfully. Document clearly. Improve continuously.</text>
  <text x="600" y="100" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">Open to internships, hackathons, open-source collaboration, and research-oriented student projects.</text>
</svg>
