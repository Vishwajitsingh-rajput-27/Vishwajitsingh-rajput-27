<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">3D contribution calendar dark fallback</title><desc id="desc">A neutral dark-mode contribution calendar illustration that is replaced by the scheduled GitHub workflow.</desc>
  <rect width="1100" height="330" rx="22" fill="#070B14" stroke="#334155"/>
  <text x="46" y="56" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">3D Contribution Calendar</text>
  <text x="46" y="86" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">Automatically refreshed from public GitHub activity.</text>
  <g transform="translate(72 135) skewX(-28) scale(1 .72)" fill="#111827" stroke="#164E63">
    <rect x="0" y="0" width="52" height="52"/><rect x="66" y="0" width="52" height="52" fill="#164E63"/><rect x="132" y="0" width="52" height="52" fill="#0E7490"/>
    <rect x="198" y="0" width="52" height="52"/><rect x="264" y="0" width="52" height="52" fill="#1D4ED8"/><rect x="330" y="0" width="52" height="52" fill="#22D3EE"/>
    <rect x="396" y="0" width="52" height="52" fill="#6D28D9"/><rect x="462" y="0" width="52" height="52"/><rect x="528" y="0" width="52" height="52" fill="#0891B2"/>
    <rect x="594" y="0" width="52" height="52" fill="#164E63"/><rect x="660" y="0" width="52" height="52"/><rect x="726" y="0" width="52" height="52" fill="#8B5CF6"/>
    <rect x="792" y="0" width="52" height="52" fill="#1D4ED8"/><rect x="858" y="0" width="52" height="52"/>
  </g>
</svg>
