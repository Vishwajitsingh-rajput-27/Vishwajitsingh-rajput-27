<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" role="img" aria-labelledby="title desc">
  <title id="title">Animated professional roles</title>
  <desc id="desc">Cycles through Full-Stack Developer, AI and Geospatial Builder, and Computer Engineering Student.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.55" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <clipPath id="clip"><rect x="18" y="8" width="864" height="56" rx="16"/></clipPath>
  </defs>
  <rect x="1" y="1" width="898" height="70" rx="18" fill="#070B14" stroke="#334155"/>
  <circle cx="31" cy="36" r="6" fill="#22D3EE"/>
  <text x="52" y="43" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="19">Currently:</text>
  <g clip-path="url(#clip)" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="url(#accent)">
    <text x="150" y="43" opacity="1">Full-Stack Developer
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="43" opacity="0">AI &amp; Geospatial Builder
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="43" opacity="0">Computer Engineering Student
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
